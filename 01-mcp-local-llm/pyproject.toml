[project]
name = "learning-mcp-local-llm"
version = "0.1.0"
description = "Minimal MCP server used by a local Ollama model through tool calling"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "ollama>=0.6,<1",
  "pyyaml>=6,<7",
  "rich>=14,<15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcplab"]

[tool.uv]
package = true
