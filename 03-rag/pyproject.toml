[project]
name = "learning-rag"
version = "0.1.0"
description = "Small RAG workbench: chunk, embed, retrieve, build the context, generate, and measure every step"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "numpy>=2,<3",
  "rich>=14,<15",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
