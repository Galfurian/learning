device: cnc
name: Engraving Cell
kind: CNC and arm
cell: cnc
nodes:
- folder: Status
  description: Current device state.
  children:
  - variable: Busy
    type: bool
    initial: false
    description: True while the current operation runs.
    display: Busy flag
  - variable: CurrentMission
    type: string
    initial: ''
    description: Name of the active mission.
    display: Current mission
  - variable: LastResult
    type: string
    initial: idle
    description: Result of the last operation.
    display: Last result
- folder: Alarms
  description: Alarm flags reported by the device.
  children:
  - variable: NoAirPressure
    type: bool
    initial: false
    description: The air supply is below the safe level.
    display: Low air pressure
  - variable: EmergencyStop
    type: bool
    initial: false
    description: An emergency stop is active.
    display: Emergency stop
  - variable: MotorTrip
    type: bool
    initial: false
    description: The drive motor has tripped.
    display: Motor trip
  - variable: RFIDFault
    type: bool
    initial: false
    description: A pallet RFID read failed.
    display: RFID reader fault
- folder: Arm
  description: Arm and spindle operations.
  children:
  - variable: AtPallet
    type: bool
    initial: false
    description: True when the arm is at the pallet.
    display: At pallet
  - method: PickBoard
    description: Picks a board from the pallet.
    parameters: []
    returns:
    - name: done
      type: bool
      description: True when picked.
    display: Pick board
  - method: Engrave
    description: Engraves the board identifier.
    parameters:
    - name: serial
      type: string
      description: Board serial number.
    returns:
    - name: done
      type: bool
      description: True when engraving is complete.
    display: Engrave board
  - method: PlaceBoard
    description: Places the board on the pallet.
    parameters: []
    returns:
    - name: done
      type: bool
      description: True when placed.
    display: Place board
- folder: Statistics
  description: Counters for the current shift.
  children:
  - variable: CyclesToday
    type: number
    initial: 0
    description: Completed cycles since the shift started.
  - variable: FaultsToday
    type: number
    initial: 0
    description: Faults recorded since the shift started.
  - variable: MinutesRunning
    type: number
    initial: 0
    description: Running minutes since the last reset.
  - variable: LastCycleSeconds
    type: number
    initial: 0
    description: Duration of the last completed cycle.
    display: Last cycle time
- folder: Diagnostics
  description: Checks used by maintenance staff.
  children:
  - variable: CommunicationOk
    type: bool
    initial: true
    description: True when the controller answers.
    display: Communication healthy
  - variable: SafetyOk
    type: bool
    initial: true
    description: True when safety inputs are healthy.
  - variable: Firmware
    type: string
    initial: line-1.0
    description: Invented controller firmware label.
  - method: ReadDiagnostics
    description: Reads the maintenance diagnostics.
    parameters: []
    returns:
    - name: report
      type: string
      description: Short diagnostic report.
    display: Read diagnostics
- folder: Maintenance
  description: Routine service operations.
  children:
  - method: AcknowledgeService
    description: Records a completed service visit.
    parameters:
    - name: note
      type: string
      description: Service note.
    returns:
    - name: accepted
      type: bool
      description: True when the note is saved.
    display: Acknowledge service
  - method: ResetCounters
    description: Resets shift counters after approval.
    parameters: []
    returns:
    - name: done
      type: bool
      description: True when counters are reset.
    display: Reset counters
