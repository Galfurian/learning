[project]
name = "learning-decision-models"
version = "0.1.0"
description = "Small decision-model workbench: state + typed questions in, probabilities out, application code acts"
requires-python = ">=3.11"
dependencies = [
  "rich>=14,<15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/declab"]

[tool.uv]
package = true
